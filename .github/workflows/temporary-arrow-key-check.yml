name: Temporary Hosted Arrow Key Check

on:
  push:
    branches:
      - feat/single-draft-persistence-spinners

permissions:
  contents: read

jobs:
  arrow-key-check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Playwright
        run: npm install --no-save playwright

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Check hidden spinner and ArrowUp keyboard behavior on hosted preview
        env:
          BASE_URL: https://backerfee-g4nvs4qc9-meow-7e9e.vercel.app/?_vercel_share=cyZDSHXEewOYGnNa3hZRQKysYMTyuugH
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { chromium } from 'playwright';

          const browser = await chromium.launch({ headless: true });
          try {
            const page = await browser.newPage();
            const response = await page.goto(process.env.BASE_URL, { waitUntil: 'domcontentloaded', timeout: 45000 });
            assert.equal(response?.status(), 200, 'Authorized preview should load with HTTP 200');
            const taxRate = page.locator('#taxRate');
            await taxRate.waitFor({ state: 'visible', timeout: 15000 });
            assert.equal(await taxRate.evaluate(el => getComputedStyle(el).appearance), 'textfield',
              'Tax rate input should suppress the number spinner appearance');

            await taxRate.fill('7.75');
            await taxRate.press('ArrowUp');
            const after = Number(await taxRate.inputValue());
            assert.equal(after, 7.76, 'ArrowUp should still increment the numeric value by its 0.01 step');
            console.log(JSON.stringify({ result: 'PASS', visibleSpinner: false, before: 7.75, afterArrowUp: after }));
          } finally {
            await browser.close();
          }
          NODE
