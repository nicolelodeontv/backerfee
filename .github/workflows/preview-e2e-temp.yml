name: Temporary Deployed Preview E2E

on:
  pull_request:
    branches:
      - main

jobs:
  deployed-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Playwright
        run: npm install --no-save playwright

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run the complete Chromium suite against the deployed Vercel preview
        env:
          BASE_URL: "https://backerfee-3zv5fhvya-meow-7e9e.vercel.app/?_vercel_share=LXvKK1cbJ713eT5iQmMUMIGcsiBYbonL"
          SCREENSHOT_DIR: artifacts/preview
        run: node tests/browser/batch-layout.spec.mjs

      - name: Upload preview screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployed-preview-browser-screenshots
          path: artifacts/preview/
          if-no-files-found: warn
          retention-days: 3
