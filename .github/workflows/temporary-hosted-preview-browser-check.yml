name: Temporary Hosted Preview Browser Check

on:
  push:
    branches:
      - feat/single-draft-persistence-spinners

permissions:
  contents: read

jobs:
  hosted-preview-browser-check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Install Playwright for browser QA
        run: npm install --no-save playwright

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run full Chromium suite against the authorized hosted PR preview
        env:
          BASE_URL: https://backerfee-g4nvs4qc9-meow-7e9e.vercel.app/?_vercel_share=cyZDSHXEewOYGnNa3hZRQKysYMTyuugH
          SCREENSHOT_DIR: artifacts/hosted-preview
        run: node tests/browser/batch-layout.spec.mjs

      - name: Upload preview screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: temporary-hosted-preview-browser-screenshots
          path: artifacts/
          if-no-files-found: warn
          retention-days: 3
