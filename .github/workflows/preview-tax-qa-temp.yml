name: Temporary deployed preview tax QA

on:
  pull_request:
    branches:
      - main

jobs:
  deployed-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies and Playwright
        run: npm install && npm install --no-save playwright

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Chromium checks against deployed Vercel preview
        env:
          BASE_URL: https://backerfee-git-fix-minted-tax-entry-20261024-meow-7e9e.vercel.app/
          SCREENSHOT_DIR: artifacts/deployed-preview
        run: node tests/browser/batch-layout.spec.mjs

      - name: Upload deployed preview screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: temporary-deployed-preview-tax-qa
          path: artifacts/deployed-preview/
          if-no-files-found: warn
          retention-days: 3
